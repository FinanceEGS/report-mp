<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#D4AF37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="REPORT MP">
  <meta name="mobile-web-app-capable" content="yes">

  <title>REPORT MP GW J&T 2026</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    #app {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: #fff;
      font-family: Arial, sans-serif;
      color: #222;
    }

    #loading img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      object-fit: cover;
    }

    #loading b {
      font-size: 18px;
    }

    #loading span {
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div id="loading">
    <img src="./icon-192.png" alt="REPORT MP">
    <b>REPORT MP</b>
    <span>Memuat aplikasi...</span>
  </div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbxdc_SA2WTgpCG6JEiaqUWi2zYCjpHm_7OE3uiexSf-LaopQbV9roEDw3o5SWCH6yIHOA/exec"
    title="REPORT MP"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <script>
    const iframe = document.getElementById('app');
    const loading = document.getElementById('loading');

    iframe.addEventListener('load', function () {
      setTimeout(function () {
        loading.style.display = 'none';
      }, 700);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function(err) {
          console.log('SW:', err);
        });
      });
    }
  </script>
</body>
</html>
